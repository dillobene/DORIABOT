<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORIABOT • La voce del tifo</title><style>:root{font-family:system-ui,sans-serif;color:white;background:#0d3474}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(155deg,#133e92,#071b42)}main{width:min(92%,450px);text-align:center}h1{font-size:3rem;margin:10px 0}.stripe{height:13px;background:linear-gradient(to bottom,#fff 0 20%,#df2638 20% 40%,#101010 40% 60%,#fff 60% 80%,#fff 80%)}.panel{border:1px solid #ffffff55;border-radius:22px;padding:25px 18px;background:#ffffff15;box-shadow:0 12px 40px #0004}button{border:0;border-radius:50px;padding:18px 25px;background:#fff;color:#12366c;font-size:1.1rem;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#answer{font-size:1.3rem;min-height:90px;line-height:1.4}#heard{opacity:.8;min-height:35px}small{opacity:.75}.red{background:linear-gradient(145deg,#b11224,#142c5c)}.red button{color:#ae1627}</style></head><body><main><div class="panel"><div class="stripe"></div><h1 id="name">DORIABOT</h1><p id="subtitle">La voce del tifo blucerchiato 💙</p><p id="answer">Ciao! Tocca il microfono e dimmi qualcosa sulla Samp!</p><p id="heard"></p><button id="mic">🎤 PARLA CON ME</button><p><small id="status">Consenti l'accesso al microfono quando richiesto.</small></p></div></main><script>
let count=0,revealed=false;const mic=document.getElementById('mic'),answer=document.getElementById('answer'),heard=document.getElementById('heard'),status=document.getElementById('status');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=SR?new SR():null;if(rec){rec.lang='it-IT';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>respond(e.results[0][0].transcript);rec.onerror=e=>{status.textContent='Microfono: '+e.error+'. Riprova.';mic.disabled=false};rec.onend=()=>{mic.disabled=false;mic.textContent='🎤 PARLA CON ME'}}else{status.textContent='Riconoscimento vocale non disponibile in questo browser. Prova Chrome.';mic.disabled=true}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.96;u.pitch=1.02;const voices=speechSynthesis.getVoices();const it=voices.find(v=>v.lang.toLowerCase().startsWith('it'));if(it)u.voice=it;speechSynthesis.speak(u)}
function respond(t){heard.textContent='Hai detto: '+t;count++;let r;if(count===1){r='Eh belin, qui si parla di calcio genovese! Dimmi, quanto sei sampdoriana da uno a dieci?'}else if(count===2){r='Ah, una vera tifosa! Ma sei proprio sicura di conoscere tutta la storia del calcio a Genova?'}else if(!revealed){revealed=true;document.body.classList.add('red');document.getElementById('name').textContent='GRIFOBOT 1893 🦅';document.getElementById('subtitle').textContent='SORPRESA! ❤️💙';r='BELIN, FIGGEUA! Ma davvero pensavi che fossi doriano? Ti ha fregato un genoano! FORZA GENOA! La storia siamo noi!'}else{const s=t.toLowerCase();if(s.includes('samp')||s.includes('doria'))r='Belin, ancora con la Samp? Ti voglio bene lo stesso, ma il mio cuore è rossoblù!';else if(s.includes('scudett'))r='Nove scudetti, figgeua! Nove! E qui finisce la lezione di storia!';else if(s.includes('pap')||s.includes('padre'))r='Tuo papà? Un intenditore del Grifone, belin!';else if(s.includes('genoa')||s.includes('grifone'))r='Ecco, finalmente parliamo di cose serie! FORZA GENOA!';else{const replies=['Belin, mi fai mugugnare! Ma sempre forza Grifone!','Figgeua, il derby è bello proprio perché ci prendiamo in giro!','Ti concedo una battuta, ma il cuore resta rossoblù!','Macaja o tramontana, sempre Genoa dalla mattina!'];r=replies[count%replies.length]}}answer.textContent=r;status.textContent='Tocca di nuovo il microfono per rispondere.';speak(r)}
mic.onclick=()=>{if(!rec)return;speechSynthesis.cancel();mic.disabled=true;mic.textContent='🎧 TI ASCOLTO...';status.textContent='Parla ora';try{rec.start()}catch(e){mic.disabled=false;status.textContent='Riprova tra un attimo.'}}
</script></body></html>
